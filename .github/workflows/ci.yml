# Build, vet, test and lint on every pull request.
#
# Until this existed, nothing in this repository ran on a pull request: the
# only workflow reacting to one was the Dependabot auto-approve helper, and
# release.yml runs on push. Dependency updates were therefore merged, or not
# merged, without anything ever having compiled them.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A superseded pull request run can be dropped. A run on main is left alone.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          # The toolchain the module declares, so CI and goreleaser agree.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -count=1 disables the test cache, which is what makes a dependency
      # bump actually exercise the tests rather than replay an old result.
      - name: Test
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned rather than latest: a linter that gains a rule overnight
          # turns every open pull request red for reasons unrelated to them.
          version: v2.5.0
